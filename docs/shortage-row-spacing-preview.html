<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピタコマ コマ組み行 日時表現 UI プレビュー v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/shared/styles/variables.css">
  <link rel="stylesheet" href="shortage-row-spacing-preview.css">
</head>
<body>
  <header class="preview-header">
    <div class="preview-header-inner">
      <h1>コマ組み行 — 日時表現 プレビュー v3</h1>
      <p><strong>案C方向</strong>（教科1字・苗字+先生・1行固定）のまま、<strong>日時の見せ方だけ</strong>を4案比較します。列幅240px＝本番の仮決め列。</p>
      <p class="preview-url">URL: <a href="http://localhost:5173/docs/shortage-row-spacing-preview.html">http://localhost:5173/docs/shortage-row-spacing-preview.html</a></p>
    </div>
  </header>

  <main class="preview-main">
    <section class="intro-block">
      <h2>共通ルール（4案すべて）</h2>
      <ul class="rule-list" id="ruleList"></ul>
      <div id="evalRecommend" class="recommend-box"></div>
    </section>

    <section class="compare-block">
      <h2>比較の基準</h2>
      <p class="section-desc">左：公開中 / 右：前回の案C（日時 pill が太い）</p>
      <div class="baseline-grid" id="baselineGrid"></div>
    </section>

    <section class="compare-block">
      <h2>案C1〜C4 — 日時表現の改善案</h2>
      <p class="section-desc">長い生徒名（テストはなこ）がどこまで読めるかを見てください。</p>
      <div id="variantGrid" class="variant-grid"></div>
    </section>

    <section class="compare-block">
      <h2>各案の長所・短所</h2>
      <div id="prosConsGrid" class="pros-cons-grid"></div>
    </section>
  </main>

  <script src="shortage-row-spacing-preview.js"></script>
</body>
</html>

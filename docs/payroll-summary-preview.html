<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピタコマ 給与集計プレビュー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/shared/styles/variables.css">
  <link rel="stylesheet" href="/src/shared/styles/inline-confirm.css">
  <link rel="stylesheet" href="/src/admin/styles/admin.css">
  <link rel="stylesheet" href="payroll-summary-preview.css">
</head>
<body>
  <header class="preview-header">
    <div class="preview-header-inner">
      <h1>給与集計 — 試しページ</h1>
      <p>本番と同じ見た目です。事務時間を入れる → 確定する → 「CSVをダウンロード」でファイルを保存できます（数字は見本です）。</p>
    </div>
  </header>

  <main class="app preview-app">
    <section id="view-payroll" class="view active">
      <div class="card fin-summary-card">
        <h2>今月の給与サマリー<span class="match-status-badge is-pending" id="payMonthBadge">未確定</span></h2>
        <div id="payMonthSummary" class="fin-summary-grid"></div>
      </div>
      <div class="card cal-card">
        <div class="cal-header">
          <button type="button" class="cal-nav-btn" id="payPrevBtn" aria-label="前の月">‹</button>
          <div class="cal-title" id="payTitle">2026年9月</div>
          <button type="button" class="cal-nav-btn" id="payNextBtn" aria-label="次の月">›</button>
          <button type="button" class="cal-today-btn" id="payTodayBtn">今月</button>
          <span class="help-tip" tabindex="0">?<span class="help-tip-text">確定した授業のコマ給・交通費に、入力した事務時間の事務給を足します。確定したあとに「CSVをダウンロード」を押すと、クラウド給与に取り込むファイルが保存されます。</span></span>
        </div>
        <div id="payrollNotice"></div>
        <div class="student-list" id="payTeacherList"></div>
        <div id="payrollActionCard"></div>
      </div>
    </section>
  </main>
  <script type="module" src="payroll-summary-preview.js"></script>
</body>
</html>

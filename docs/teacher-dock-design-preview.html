<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピタコマ 提出ドック デザイン10案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="teacher-dock-design-preview.css">
</head>
<body>
  <header class="preview-header">
    <div class="preview-header-inner">
      <h1>提出ドック — デザイン10案（W11ベース）</h1>
      <p>文言固定：見出し「授業の承認・辞退」／青ボタン「確認結果を提出する」。カードの色・線の付け方だけ比較。</p>
    </div>
  </header>

  <main class="preview-main">
    <section>
      <h2>なぜ今の案がイマイチか</h2>
      <div id="problemBox" class="note-box"></div>
      <div class="compare-old" id="oldDock"></div>
    </section>

    <section>
      <h2>固定文言（W11改）</h2>
      <div id="wordBox" class="note-box"></div>
      <div id="recommendBox" class="recommend-box"></div>
    </section>

    <section>
      <h2>デザイン D1〜D10</h2>
      <p class="section-desc">左の太線・上段だけ色、を避けた案です。番号で選んでください。</p>
      <div id="designGrid" class="grid-10"></div>
    </section>
  </main>

  <script src="teacher-dock-design-preview.js"></script>
</body>
</html>

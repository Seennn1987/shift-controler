<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピタコマ 確定コマ 青枠10パターン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="teacher-mycal-row-preview.css">
</head>
<body>
  <header class="preview-header">
    <div class="preview-header-inner">
      <h1>確定コマ — 青枠 10パターン（左線なし）</h1>
      <p>確定バッジは<strong>青</strong>。カード全体の枠・背景・リングで表現</p>
    </div>
  </header>

  <main class="preview-main">
    <section class="intro-block">
      <h2>ルール</h2>
      <div id="evalRecommend" class="recommend-box"></div>
    </section>

    <section class="compare-block">
      <h2>承認待ち vs 確定（対比）</h2>
      <div id="stateCompare" class="compare-row"></div>
    </section>

    <section class="compare-block">
      <h2>B1〜B10 — 確定コマ（4講）</h2>
      <p class="section-desc">左線・border-left は一切使いません。番号を教えてください。</p>
      <div id="blueGrid" class="pattern-grid-10"></div>
    </section>
  </main>

  <script src="teacher-mycal-row-preview.js"></script>
</body>
</html>

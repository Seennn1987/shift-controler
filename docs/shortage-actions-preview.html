<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピタコマ コマ組み操作ボタン UI プレビュー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/shared/styles/variables.css">
  <link rel="stylesheet" href="shortage-actions-preview.css">
</head>
<body>
  <header class="preview-header">
    <div class="preview-header-inner">
      <h1>コマ組み — 4操作ボタン UI プレビュー</h1>
      <p>「色とデザインがバラバラ」「横幅が広すぎる」への回答。公開中と<strong>4案</strong>を比較します。おすすめは<strong>案A</strong>です。</p>
      <p class="preview-url">URL: <a href="http://localhost:5173/docs/shortage-actions-preview.html">http://localhost:5173/docs/shortage-actions-preview.html</a></p>
    </div>
  </header>

  <main class="preview-main">
    <section class="intro-block">
      <h2>UI/UX 評価（公開中）</h2>
      <div id="evalGrid" class="eval-grid"></div>
      <div id="recommendBox" class="recommend-box"></div>
    </section>

    <section class="compare-block">
      <h2>① 公開中 vs 改善案 — 並べて比較</h2>
      <p class="section-desc">上段が4段フロー（参考）、その下が4ボタン。カラム幅は本番に近い960pxです。</p>
      <div id="variantGrid" class="variant-grid"></div>
    </section>

    <section class="compare-block">
      <h2>② 各案の長所・短所</h2>
      <div id="prosCons" class="pros-cons-grid"></div>
    </section>

    <section class="compare-block">
      <h2>③ 案A — スマホ幅（375px）</h2>
      <div id="mobileA" class="mobile-frame"></div>
    </section>
  </main>

  <script src="shortage-actions-preview.js"></script>
</body>
</html>

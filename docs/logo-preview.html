<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピタコマ 左上ロゴ案 プレビュー</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/shared/styles/variables.css">
  <link rel="stylesheet" href="/src/admin/styles/admin.css">
  <style>
    body{background:var(--surface-page);color:var(--ink);font-family:var(--font-family);margin:0;}
    .lp-main{max-width:1080px;margin:0 auto;padding:var(--space-8) var(--space-6) 48px;}
    .lp-page-title{font-size:var(--text-3xl);font-weight:var(--font-weight-bold);margin:0 0 var(--space-3);}
    .lp-lead{font-size:var(--text-base);line-height:var(--leading-relaxed);margin:0 0 var(--space-7);}
    .lp-section-title{font-size:var(--text-xl);font-weight:var(--font-weight-bold);margin:var(--space-8) 0 var(--space-3);}
    .lp-desc{font-size:var(--text-md);color:var(--ink-soft);margin:0 0 var(--space-5);line-height:var(--leading-relaxed);}
    .lp-list{display:flex;flex-direction:column;gap:var(--space-6);}
    .lp-card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);}
    .lp-card.is-recommended{border-color:var(--pending-border);box-shadow:0 0 0 1px var(--pending-border);}
    .lp-card-head{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;}
    .lp-card-head h3{font-size:var(--text-lg);font-weight:var(--font-weight-bold);margin:0;}
    .lp-card-desc{font-size:var(--text-md);color:var(--ink-soft);line-height:var(--leading-relaxed);margin:0;}
    .lp-label{font-size:var(--text-xs);color:var(--ink-soft);margin-bottom:var(--space-1);}
    .lp-frame{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
    .lp-frame.is-phone{width:375px;max-width:100%;}
    .lp-row{display:flex;gap:var(--space-6);flex-wrap:wrap;align-items:flex-start;}
    .lp-row > div{min-width:0;}
    .lp-row > .lp-grow{flex:1 1 420px;}

    /* ロゴ部品（既存にロゴ部品がないため新規） */
    .brand-logo{display:flex;align-items:center;gap:8px;margin:0;line-height:1;}
    .brand-logo-icon{width:24px;height:24px;flex:none;display:block;}
    .brand-logo-text{font-size:var(--text-2xl);font-weight:var(--font-weight-bold);letter-spacing:.04em;color:var(--text-on-brand);}
    .brand-logo.is-black .brand-logo-text{font-weight:var(--font-weight-black);letter-spacing:.06em;}
    .brand-pi{position:relative;display:inline-block;}
    .brand-pi::after{content:"";position:absolute;top:.04em;right:.16em;width:.24em;height:.24em;border-radius:1.5px;background:var(--brand-500);}
    .brand-logo.is-white-dot .brand-pi::after{background:var(--text-on-brand);}
    .brand-logo-sub{font-size:var(--text-xs);font-weight:var(--font-weight-medium);color:rgba(255,255,255,.7);letter-spacing:.02em;margin-left:2px;}

    .lp-teacher header.top{padding:var(--space-7) var(--space-6);}
    .lp-teacher .sub{font-size:var(--text-md);color:rgba(255,255,255,.65);margin-top:6px;}

    @media (max-width:480px){
      .lp-main{padding:var(--space-6) var(--space-5) 40px;}
    }
  </style>
</head>
<body>
  <main class="lp-main">
    <h1 class="lp-page-title">ピタコマ 左上ロゴ案（5パターン）</h1>
    <p class="lp-lead">画面の左上にある「ピタコマ」の文字を、ロゴにする案です。どの案も、決まったファビコン（B案：「ピ」の丸が四角いコマ）と見た目をそろえています。<br>上の帯は本番と同じ色・同じ高さで再現しています。</p>

    <div class="lp-list" id="logoList"></div>

    <h2 class="lp-section-title">講師ページでの見え方（おすすめ案）</h2>
    <p class="lp-desc">講師ページの上部も同じロゴにそろえた場合のイメージです。</p>
    <div class="lp-frame lp-teacher" id="teacherMock"></div>
  </main>

  <script>
    const ICON_SVG = `<svg class="brand-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#3B7DE9"/>
      <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 7.5V21.5Q9.5 25 13 25H23.5"/>
        <path d="M9.5 15.8L18.5 13.3"/>
      </g>
      <rect x="21" y="4.5" width="6.5" height="6.5" rx="1.4" fill="#fff"/>
    </svg>`;

    const ICON_WHITE_SVG = `<svg class="brand-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#fff"/>
      <g fill="none" stroke="#3B7DE9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 7.5V21.5Q9.5 25 13 25H23.5"/>
        <path d="M9.5 15.8L18.5 13.3"/>
      </g>
      <rect x="21" y="4.5" width="6.5" height="6.5" rx="1.4" fill="#3B7DE9"/>
    </svg>`;

    const PI_TEXT = '<span class="brand-pi">ヒ</span>タコマ';

    const LOGOS = [
      {
        id: 'A',
        name: '案A マーク＋文字',
        desc: 'ファビコンのマークを左に置き、文字は今の「ピタコマ」のまま少しだけ大きく。いちばん落ち着いていて、どの画面にもなじみます。',
        html: `<h1 class="brand-logo" aria-label="ピタコマ">${ICON_SVG}<span class="brand-logo-text">ピタコマ</span></h1>`,
      },
      {
        id: 'B',
        name: '案B マーク＋文字（四角い点）',
        desc: '案Aの文字の「ピ」の丸も、マークと同じ青い四角に。マークと文字がひとつながりに見え、「ロゴらしさ」がいちばん出ます。',
        html: `<h1 class="brand-logo" aria-label="ピタコマ">${ICON_SVG}<span class="brand-logo-text">${PI_TEXT}</span></h1>`,
      },
      {
        id: 'C',
        name: '案C 文字だけ（四角い点）',
        desc: 'マークは置かず、「ピ」の丸だけを青い四角に。すっきりしていて、今の見た目から一番変化が小さい案です。',
        html: `<h1 class="brand-logo" aria-label="ピタコマ"><span class="brand-logo-text">${PI_TEXT}</span></h1>`,
      },
      {
        id: 'D',
        name: '案D 白いマーク＋太い文字',
        desc: 'マークを白地に青で反転し、文字も極太に。濃い帯の上でいちばん目立ちますが、ファビコン（青地）とは色が逆になります。',
        html: `<h1 class="brand-logo is-black" aria-label="ピタコマ">${ICON_WHITE_SVG}<span class="brand-logo-text">ピタコマ</span></h1>`,
      },
      {
        id: 'E',
        name: '案E マーク＋文字＋ひとこと',
        desc: '案Aの右に「個別指導塾のコマ管理」を小さく添える。初めて見る人にも何のサービスか伝わりますが、スマホでは帯が少し窮屈になります。',
        html: `<h1 class="brand-logo" aria-label="ピタコマ 個別指導塾のコマ管理">${ICON_SVG}<span class="brand-logo-text">ピタコマ</span><span class="brand-logo-sub">個別指導塾のコマ管理</span></h1>`,
      },
    ];

    const RECOMMENDED = 'B';

    function adminHeader(logoHtml, showEmail) {
      return `<header class="top">
        <div class="inner">
          <div class="brand">${logoHtml}</div>
          <div class="header-account">
            ${showEmail ? '<span class="header-email">kyoshitsu@example.com</span>' : ''}
            <button type="button" class="logout-btn">カレンダーにつなぐ</button>
            <button type="button" class="logout-btn">お知らせ</button>
            <button type="button" class="logout-btn">ログアウト</button>
          </div>
        </div>
      </header>`;
    }

    document.getElementById('logoList').innerHTML = LOGOS.map((logo) => {
      const isRec = logo.id === RECOMMENDED;
      return `<section class="lp-card${isRec ? ' is-recommended' : ''}">
        <div class="lp-card-head">
          <h3>${logo.name}</h3>
          ${isRec ? '<span class="match-status-badge is-priority">おすすめ</span>' : ''}
        </div>
        <p class="lp-card-desc">${logo.desc}</p>
        <div class="lp-row">
          <div class="lp-grow">
            <div class="lp-label">パソコン</div>
            <div class="lp-frame">${adminHeader(logo.html, true)}</div>
          </div>
          <div>
            <div class="lp-label">スマホ（375px）</div>
            <div class="lp-frame is-phone">${adminHeader(logo.html, false)}</div>
          </div>
        </div>
      </section>`;
    }).join('');

    const rec = LOGOS.find((logo) => logo.id === RECOMMENDED);
    document.getElementById('teacherMock').innerHTML = `<header class="top">
      <div class="inner">
        <div>
          ${rec.html}
          <div class="sub">山田 太郎 先生</div>
        </div>
        <div class="header-account">
          <button type="button" class="logout-btn">ログアウト</button>
        </div>
      </div>
    </header>`;
  </script>
</body>
</html>

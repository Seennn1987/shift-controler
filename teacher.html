<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピタコマ｜講師用ページ</title>
<style>
  :root{
    --ink:#1e1e1f;
    --ink-soft:#68696d;
    --green-900:#25272b;
    --green-800:#34373d;
    --green-700:#474b52;
    --green-500:#7a7e87;
    --green-100:#eef0f2;
    --cream:#f7f7f6;
    --card:#ffffff;
    --border:#e0e0e0;
    --danger:#b3462c;
  }
  *{box-sizing:border-box;}
  button{outline:none;}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:820px;margin:0 auto;padding:0 16px 60px;}
  header.top{background:var(--green-900);color:#fff;padding:18px 16px;margin-bottom:20px;}
  header.top .inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header.top h1{font-size:17px;margin:0;font-weight:700;}
  header.top .sub{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px;}
  .header-account{display:flex;align-items:center;gap:12px;}
  .header-email{font-size:11.5px;color:rgba(255,255,255,.75);}
  .logout-btn{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;}
  .logout-btn:hover{background:rgba(255,255,255,.1);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 18px;margin-bottom:16px;}
  .card h2{font-size:14.5px;margin:0 0 10px;color:var(--green-900);}
  .desc{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:0 0 12px;}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:30px 24px;width:100%;max-width:340px;}
  .login-title{font-size:18px;margin:0;font-weight:700;text-align:center;}
  .login-sub{font-size:12px;color:var(--ink-soft);text-align:center;margin:6px 0 22px;}
  .field-label{display:block;font-size:12px;font-weight:700;color:var(--green-800);margin-bottom:6px;}
  input[type=email], input[type=password], input[type=text]{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    font-family:inherit;font-size:14px;background:#fdfcf9;
  }
  .primary{
    border:none;background:var(--green-900);color:#fff;font-family:inherit;font-size:14px;font-weight:700;
    padding:11px 18px;border-radius:8px;cursor:pointer;
  }
  .primary:hover{opacity:.9;}
  .login-msg{font-size:12px;color:var(--danger);text-align:center;margin-top:12px;min-height:16px;}

  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .nav-btn{border:1px solid var(--border);background:#fff;width:32px;height:32px;border-radius:8px;font-size:15px;cursor:pointer;}
  .month-title{font-size:15px;font-weight:700;flex:1;text-align:center;}
  .today-btn{border:1px solid var(--border);background:#fff;font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;}

  .status-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin:10px 0 14px;}
  .status-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
  .status-badge.submitted{background:var(--green-100);color:var(--green-900);}
  .status-badge.draft{background:#fdf0d8;color:#8a6100;}

  .grid-scroll{border:1px solid var(--border);border-radius:8px;}
  table.grid{border-collapse:collapse;width:100%;}
  table.grid th, table.grid td{border:1px solid var(--border);text-align:center;font-size:12px;padding:0;}
  table.grid thead th{background:var(--green-100);color:var(--green-900);font-weight:700;padding:7px 4px;font-size:11px;position:sticky;top:0;z-index:1;}
  table.grid tbody th{background:#fdfcf9;color:var(--ink);text-align:left;padding:6px 10px;font-weight:700;white-space:nowrap;font-size:12px;}
  .cell-btn{width:100%;height:40px;border:none;background:transparent;cursor:pointer;font-size:18px;font-weight:900;color:#ddd;position:relative;}
  .cell-btn.st-normal{color:var(--ink-soft);}
  .cell-btn.st-preferred{color:var(--ink);}
  .cell-btn.requested{border:1.5px dashed var(--danger);}
  .cell-btn .req-badge{
    position:absolute;top:1px;right:2px;font-size:8px;font-weight:700;color:var(--danger);
  }
  .cell-btn.pending-local{border:1.5px dashed var(--green-700);}
  .cell-btn .local-badge{
    position:absolute;top:1px;right:2px;font-size:8px;font-weight:700;color:var(--green-700);
  }
  .send-request-btn{
    border:none;background:var(--danger);color:#fff;font-family:inherit;font-size:13px;font-weight:700;
    padding:10px 16px;border-radius:8px;cursor:pointer;
  }
  .send-request-btn:disabled{background:#ccc;cursor:default;}

  .form-actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;}
  .form-msg{font-size:12px;color:var(--ink-soft);}
  .empty-note{color:var(--ink-soft);font-size:12.5px;padding:10px 2px;}
  .new-assign-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-bottom:8px;background:#fdfcf9;
  }
  .new-assign-row.approved{opacity:.55;}
  .na-detail{font-size:13px;}
  .na-detail b{font-weight:700;}
  .na-detail .na-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .approve-btn{
    border:none;background:var(--green-900);color:#fff;font-family:inherit;font-size:12px;font-weight:700;
    padding:7px 14px;border-radius:7px;cursor:pointer;flex-shrink:0;
  }
  .approved-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
</style>
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1 class="login-title">ピタコマ</h1>
    <div class="login-sub">講師用ページ</div>
    <label class="field-label" for="loginEmail">メールアドレス</label>
    <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
    <div style="height:14px"></div>
    <label class="field-label" for="loginPassword">パスワード</label>
    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="パスワード">
    <div style="height:18px"></div>
    <button type="button" class="primary" id="loginBtn" style="width:100%;">ログイン</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<header class="top" id="appHeader" style="display:none;">
  <div class="inner">
    <div>
      <h1>ピタコマ</h1>
      <div class="sub" id="myNameLabel">講師用ページ</div>
    </div>
    <div class="header-account">
      <span id="loginUserEmail" class="header-email"></span>
      <button type="button" id="logoutBtn" class="logout-btn">ログアウト</button>
    </div>
  </div>
</header>

<div class="app" id="appRoot" style="display:none;">
  <div class="card" id="newAssignCard" style="display:none;">
    <h2>新しく決まった授業</h2>
    <p class="desc">教室長が確定した授業です。内容を確認して承認してください。</p>
    <div class="form-actions" style="margin-top:0;margin-bottom:10px;">
      <button type="button" class="primary" id="approveAllBtn">まとめて承認する</button>
    </div>
    <div id="newAssignWrap"></div>
  </div>

  <div class="card">
    <h2>月次スケジュール</h2>
    <p class="desc">クリックするたびに「×不可 → ○特に希望 → △対応可能 → ×不可」の順に切り替わります。未提出の月は直接編集できます。提出済み（確定）の月を変更したい場合は、クリックすると教室長に変更リクエストが届きます（自動では反映されません）。</p>
    <div class="month-nav">
      <button type="button" class="nav-btn" id="prevBtn">‹</button>
      <div class="month-title" id="monthTitle">2026年8月</div>
      <button type="button" class="nav-btn" id="nextBtn">›</button>
      <button type="button" class="today-btn" id="todayBtn">今月</button>
    </div>
    <div class="status-bar" id="statusBar"></div>
    <div class="grid-scroll" id="gridWrap"></div>
    <div class="form-actions">
      <button class="primary" id="submitBtn">この内容で提出する</button>
      <button class="send-request-btn" id="sendRequestBtn" style="display:none;">変更をリクエストする（0件）</button>
      <span class="form-msg" id="formMsg"></span>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDi-JiKWiW5jraE8SHK-vvQ1SRCZTFbu4c",
  authDomain: "shift-controller-4ecaf.firebaseapp.com",
  projectId: "shift-controller-4ecaf",
  storageBucket: "shift-controller-4ecaf.firebasestorage.app",
  messagingSenderId: "291648754129",
  appId: "1:291648754129:web:49bca52590e7b018ded0f0",
  measurementId: "G-G3TEYJYJFW"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();

const SLOTS = [
  {id:4, label:'4講', time:'14:50〜16:20'},
  {id:5, label:'5講', time:'16:40〜18:10'},
  {id:6, label:'6講', time:'18:20〜19:50'},
  {id:7, label:'7講', time:'20:00〜21:30'},
];
const WEEKDAY_JP = ['日','月','火','水','木','金','土'];

function pad2(n){ return String(n).padStart(2,'0'); }
function daysInYearMonth(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function cycleState(s){
  if(s==='none') return 'preferred';
  if(s==='preferred') return 'normal';
  return 'none';
}
function labelFor(s){
  return s==='none' ? '×' : (s==='preferred' ? '○' : '△');
}

let myAdminUid = null, myTeacherId = null, myTeacherName = '';
let curYear, curMonth;
let scheduleDoc = {months:{}};
let pendingRequests = [];
let localOverrides = {}; // 提出済み月で、まだ送信していない下書きの変更（key: "日付|コマ" -> 状態）

function cellKey(dateStr, slot){ return `${dateStr}|${slot}`; }

function showLogin(msg){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appHeader').style.display = 'none';
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginMsg').textContent = msg || '';
}

function handleLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  if(!email || !password){ msg.textContent = 'メールアドレスとパスワードを入力してください。'; return; }
  msg.textContent = '確認中…';
  fbAuth.signInWithEmailAndPassword(email, password).catch(err=>{
    let text = 'ログインに失敗しました。';
    if(err.code==='auth/invalid-email') text = 'メールアドレスの形式が正しくありません。';
    if(err.code==='auth/user-not-found' || err.code==='auth/wrong-password' || err.code==='auth/invalid-credential') text = 'メールアドレスまたはパスワードが正しくありません。';
    msg.textContent = text;
  });
}
document.getElementById('loginBtn').addEventListener('click', handleLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleLogin(); });
document.getElementById('logoutBtn').addEventListener('click', ()=>{ fbAuth.signOut(); });

fbAuth.onAuthStateChanged(async user=>{
  if(user){
    await bootstrap(user);
  }else{
    myAdminUid = null; myTeacherId = null;
    showLogin();
  }
});

async function bootstrap(user){
  document.getElementById('loginMsg').textContent = '';
  let accSnap;
  try{
    accSnap = await fbDb.collection('teacherAccounts').doc(user.uid).get();
  }catch(err){
    showLogin('データの読み込みに失敗しました。時間をおいて再度お試しください。');
    return;
  }
  if(!accSnap.exists){
    showLogin('このアカウントは講師として登録されていません。教室長にご確認ください。');
    await fbAuth.signOut();
    return;
  }
  const d = accSnap.data();
  myAdminUid = d.adminUid;
  myTeacherId = d.teacherId;
  myTeacherName = d.teacherName || '';

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appHeader').style.display = '';
  document.getElementById('appRoot').style.display = '';
  document.getElementById('myNameLabel').textContent = `${myTeacherName} さん`;
  document.getElementById('loginUserEmail').textContent = user.email || '';

  const t = new Date();
  if(curYear===undefined){ curYear = t.getFullYear(); curMonth = t.getMonth(); }
  startScheduleListener(); // 講師スケジュールをリアルタイム監視（教室長側の変更も即座に反映される）
  await loadMyPendingRequests();
  await renderNewAssignments();
  render();
}

let scheduleUnsub = null; // 講師スケジュールのリアルタイム監視解除用
function startScheduleListener(){
  if(scheduleUnsub) scheduleUnsub(); // 二重登録を防ぐ
  const ref = fbDb.collection('teacherSchedules').doc(`${myAdminUid}_${myTeacherId}`);
  scheduleUnsub = ref.onSnapshot(snap=>{
    scheduleDoc = snap.exists ? snap.data() : {months:{}};
    if(!scheduleDoc.months) scheduleDoc.months = {};
    // 教室長側の更新もこの場でリアルタイムに反映する（未送信の下書きは保持したまま）
    renderKeepingOverrides();
  }, err=>{
    console.error('スケジュール監視エラー:', err);
  });
}

async function saveMonthEntry(yearMonth, entry){
  scheduleDoc.months = scheduleDoc.months || {};
  scheduleDoc.months[yearMonth] = entry;
  const ref = fbDb.collection('teacherSchedules').doc(`${myAdminUid}_${myTeacherId}`);
  try{
    await ref.set({
      adminUid: myAdminUid,
      teacherId: myTeacherId,
      teacherLoginUid: fbAuth.currentUser.uid,
      months: scheduleDoc.months,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, {merge:true});
  }catch(err){
    console.error('保存エラー:', err);
    document.getElementById('formMsg').textContent = '保存に失敗しました。通信状況をご確認ください。';
  }
}

async function loadMyPendingRequests(){
  try{
    const snap = await fbDb.collection('scheduleChangeRequests')
      .where('teacherLoginUid','==',fbAuth.currentUser.uid).where('status','==','pending').get();
    pendingRequests = [];
    snap.forEach(doc=> pendingRequests.push({id:doc.id, ...doc.data()}));
  }catch(err){
    console.error('変更リクエスト読み込みエラー:', err);
    pendingRequests = [];
  }
}

// ---- 新しく決まった授業の承認 ----
const DAY_ORDER = {'月':0,'火':1,'水':2,'木':3,'金':4,'土':5,'日':6};
let newAssignments = [];

async function loadNewAssignments(){
  try{
    const snap = await fbDb.collection('assignmentApprovals')
      .where('teacherLoginUid','==',fbAuth.currentUser.uid).where('status','==','pending').get();
    const list = [];
    snap.forEach(doc=> list.push({id:doc.id, ...doc.data()}));
    // 曜日→コマの順に並べる（見出しでグループ化はせず、自然な並びだけにする）
    list.sort((a,b)=>{
      const dd = (DAY_ORDER[a.day]??9) - (DAY_ORDER[b.day]??9);
      if(dd!==0) return dd;
      return a.slot - b.slot;
    });
    return list;
  }catch(err){
    console.error('新しい授業の読み込みエラー:', err);
    return [];
  }
}

async function renderNewAssignments(){
  const card = document.getElementById('newAssignCard');
  const wrap = document.getElementById('newAssignWrap');
  newAssignments = await loadNewAssignments();
  if(newAssignments.length===0){
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  document.getElementById('approveAllBtn').textContent = `まとめて承認する（${newAssignments.length}件）`;
  wrap.innerHTML = newAssignments.map(a=>{
    const slotLabel = SLOTS.find(s=>s.id===a.slot);
    return `<div class="new-assign-row" data-id="${a.id}">
      <div class="na-detail">
        <div><b>${a.day}曜${slotLabel?slotLabel.label:a.slot+'講'}</b>　${a.studentName}（${a.studentGrade||''}）　${a.subject}</div>
      </div>
      <button type="button" class="approve-btn" data-id="${a.id}">承認する</button>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.approve-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> approveAssignment(btn.dataset.id));
  });
}

async function approveAssignment(id){
  try{
    await fbDb.collection('assignmentApprovals').doc(id).update({status:'approved'});
  }catch(err){
    console.error('承認エラー:', err);
    return;
  }
  await renderNewAssignments();
}

document.getElementById('approveAllBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('approveAllBtn');
  btn.disabled = true;
  try{
    for(const a of newAssignments){
      await fbDb.collection('assignmentApprovals').doc(a.id).update({status:'approved'});
    }
  }catch(err){
    console.error('一括承認エラー:', err);
  }
  btn.disabled = false;
  await renderNewAssignments();
});

function getMonthEntry(yearMonth){
  const existing = scheduleDoc.months && scheduleDoc.months[yearMonth];
  if(existing){
    if(!existing.id) existing.id = `tsch-${myTeacherId}-${yearMonth}`; // 過去データにidが無い場合の補完
    return existing;
  }
  return {id: `tsch-${myTeacherId}-${yearMonth}`, status:'draft', days:{}};
}

// 月を切り替えた時に呼ぶ（未送信の下書きをリセットする）
function render(){
  localOverrides = {};
  renderKeepingOverrides();
}
// Firestoreのリアルタイム更新を受けて再描画する時に呼ぶ（未送信の下書きは保持する）
function renderKeepingOverrides(){
  const yearMonth = `${curYear}-${pad2(curMonth+1)}`;
  document.getElementById('monthTitle').textContent = `${curYear}年${curMonth+1}月`;
  const entry = getMonthEntry(yearMonth);
  const isSubmitted = entry.status==='submitted';

  const adminNote = entry.submittedBy==='admin' ? '（教室長が代理入力した内容です。内容をご確認ください）' : '';
  document.getElementById('statusBar').innerHTML = isSubmitted
    ? `<span class="status-badge submitted">確定</span><span>この月は提出済みです${adminNote}。セルをクリックして変更内容を選び、最後に「変更をリクエストする」を押すとまとめて教室長に届きます（押すまでは送信されません）。</span>`
    : `<span class="status-badge draft">未提出</span><span>セルをクリックして入力し「この内容で提出する」を押してください${adminNote}。</span>`;

  const total = daysInYearMonth(yearMonth);
  let thead = '<thead><tr><th>日付</th>' + SLOTS.map(s=>`<th>${s.label}</th>`).join('') + '</tr></thead>';
  let tbody = '<tbody>';
  for(let d=1; d<=total; d++){
    const dateStr = `${yearMonth}-${pad2(d)}`;
    const wd = WEEKDAY_JP[new Date(dateStr+'T00:00:00').getDay()];
    tbody += `<tr><th>${d}日（${wd}）</th>`;
    SLOTS.forEach(slot=>{
      tbody += `<td>${buildCellHtml(entry, dateStr, slot.id)}</td>`;
    });
    tbody += '</tr>';
  }
  tbody += '</tbody>';
  document.getElementById('gridWrap').innerHTML = `<table class="grid">${thead}${tbody}</table>`;

  document.querySelectorAll('.cell-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> handleCellClick(btn, entry, isSubmitted, yearMonth));
  });
  updateSendButtonState();
}

// そのセルの「確定値（または既存の申請中の値）」を基準値として返す
function baselineState(entry, dateStr, slot){
  const req = pendingRequests.find(r=>r.dateStr===dateStr && r.slot===slot);
  if(req) return req.priority;
  const cur = (entry.days[dateStr]||[]).find(e=>e.slot===slot);
  return cur ? cur.priority : 'none';
}
// 表示に使う実際の状態（下書きがあればそれを優先）
function effectiveState(entry, dateStr, slot){
  const key = cellKey(dateStr, slot);
  if(localOverrides.hasOwnProperty(key)) return localOverrides[key];
  return baselineState(entry, dateStr, slot);
}
function buildCellHtml(entry, dateStr, slotId){
  const key = cellKey(dateStr, slotId);
  const state = effectiveState(entry, dateStr, slotId);
  const isDirty = localOverrides.hasOwnProperty(key);
  const isRequested = !isDirty && pendingRequests.some(r=>r.dateStr===dateStr && r.slot===slotId);
  let cls = `cell-btn st-${state}`;
  let badge = '';
  if(isDirty){ cls += ' pending-local'; badge = '<span class="local-badge">未送信</span>'; }
  else if(isRequested){ cls += ' requested'; badge = '<span class="req-badge">申請中</span>'; }
  return `<button type="button" class="${cls}" data-date="${dateStr}" data-slot="${slotId}">${labelFor(state)}${badge}</button>`;
}

async function handleCellClick(btn, entry, isSubmitted, yearMonth){
  const dateStr = btn.dataset.date;
  const slot = Number(btn.dataset.slot);

  if(!isSubmitted){
    // 未提出の月：今まで通り、直接編集してその都度保存する
    const cur = (entry.days[dateStr]||[]).find(e=>e.slot===slot);
    const curState = cur ? cur.priority : 'none';
    const next = cycleState(curState);
    entry.days[dateStr] = entry.days[dateStr] || [];
    entry.days[dateStr] = entry.days[dateStr].filter(e=>e.slot!==slot);
    if(next!=='none') entry.days[dateStr].push({slot, priority:next});
    entry.submittedBy = 'teacher'; // 講師本人が触ったことを記録
    btn.className = `cell-btn st-${next}`;
    btn.innerHTML = labelFor(next);
    await saveMonthEntry(yearMonth, entry);
    return;
  }

  // 提出済みの月：クリックしても即送信せず、画面上の下書きだけを進める
  const key = cellKey(dateStr, slot);
  const base = baselineState(entry, dateStr, slot);
  const cur = localOverrides.hasOwnProperty(key) ? localOverrides[key] : base;
  const next = cycleState(cur);
  if(next===base){
    delete localOverrides[key]; // 元の値に戻ったら「変更なし」扱いにする
  }else{
    localOverrides[key] = next;
  }
  const td = btn.closest('td');
  td.innerHTML = buildCellHtml(entry, dateStr, slot);
  td.querySelector('.cell-btn').addEventListener('click', ()=> handleCellClick(td.querySelector('.cell-btn'), entry, isSubmitted, yearMonth));
  updateSendButtonState();
}

function updateSendButtonState(){
  const count = Object.keys(localOverrides).length;
  const sendBtn = document.getElementById('sendRequestBtn');
  if(count===0){
    sendBtn.style.display = 'none';
  }else{
    sendBtn.style.display = '';
    sendBtn.textContent = `変更をリクエストする（${count}件）`;
  }
}

async function sendPendingChanges(){
  const yearMonth = `${curYear}-${pad2(curMonth+1)}`;
  const entry = getMonthEntry(yearMonth);
  const msg = document.getElementById('formMsg');
  const keys = Object.keys(localOverrides);
  if(keys.length===0) return;
  msg.textContent = '送信中…';
  try{
    for(const key of keys){
      const [dateStr, slotStr] = key.split('|');
      const slot = Number(slotStr);
      const priority = localOverrides[key];
      const existingReq = pendingRequests.find(r=>r.dateStr===dateStr && r.slot===slot);
      if(existingReq){
        await fbDb.collection('scheduleChangeRequests').doc(existingReq.id).update({priority});
        existingReq.priority = priority;
      }else{
        const docRef = await fbDb.collection('scheduleChangeRequests').add({
          adminUid: myAdminUid, teacherId: myTeacherId, teacherLoginUid: fbAuth.currentUser.uid,
          dateStr, slot, priority, status:'pending',
          submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        pendingRequests.push({id:docRef.id, dateStr, slot, priority, status:'pending'});
      }
    }
    localOverrides = {};
    msg.textContent = `✓ ${keys.length}件の変更をリクエストしました。教室長の承認をお待ちください。`;
    render();
  }catch(err){
    console.error('変更リクエストエラー:', err);
    msg.textContent = 'リクエストの送信に失敗しました。通信状況をご確認ください。';
  }
}
document.getElementById('sendRequestBtn').addEventListener('click', sendPendingChanges);

document.getElementById('prevBtn').addEventListener('click', ()=>{
  curMonth--; if(curMonth<0){ curMonth=11; curYear--; }
  render();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  curMonth++; if(curMonth>11){ curMonth=0; curYear++; }
  render();
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  const t = new Date(); curYear = t.getFullYear(); curMonth = t.getMonth();
  render();
});
document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const yearMonth = `${curYear}-${pad2(curMonth+1)}`;
  const entry = getMonthEntry(yearMonth);
  entry.status = 'submitted';
  entry.submittedBy = 'teacher';
  const msg = document.getElementById('formMsg');
  msg.textContent = '提出中…';
  await saveMonthEntry(yearMonth, entry);
  msg.textContent = '✓ 提出しました。';
  render();
});
</script>

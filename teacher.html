<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピタコマ｜講師用ページ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/shared/styles/variables.css">
<link rel="stylesheet" href="/src/shared/styles/inline-confirm.css">
<link rel="stylesheet" href="/src/teacher/styles/teacher.css">
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1 class="login-title">ピタコマ</h1>
    <div class="login-sub">講師用ページ</div>
    <label class="field-label" for="loginEmail">メールアドレス</label>
    <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
    <div style="height:14px"></div>
    <label class="field-label" for="loginPassword">パスワード</label>
    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="パスワード">
    <div style="height:18px"></div>
    <button type="button" class="primary" id="loginBtn" style="width:100%;">ログイン</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<header class="top" id="appHeader" style="display:none;">
  <div class="inner">
    <div>
      <h1>ピタコマ</h1>
      <div class="sub" id="myNameLabel">講師用ページ</div>
    </div>
    <div class="header-account">
      <span id="loginUserEmail" class="header-email"></span>
      <button type="button" id="logoutBtn" class="logout-btn">ログアウト</button>
    </div>
  </div>
</header>

<div class="app" id="appRoot" style="display:none;">
  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="mycal">マイカレンダー</button>
    <button type="button" class="tab-btn" data-tab="shift">シフト提出</button>
  </div>

  <div id="tab-mycal" class="tab-view active">
    <div class="card" id="pendingBannerCard" style="display:none;">
      <div class="pending-banner-col">
        <p class="pending-banner-line pending-banner-request" id="pendingBannerRequest" style="display:none;"></p>
        <p class="pending-banner-line pending-banner-draft" id="pendingBannerDraft" style="display:none;"></p>
        <div id="pendingBannerNotices" class="pending-banner-notices" style="display:none;"></div>
        <div class="pending-banner-actions">
          <button type="button" class="ghost draft-approve-all-btn" id="draftApproveAllBtn" style="display:none;">残りをすべて承認する</button>
          <button type="button" class="primary" id="submitResponsesBtn" style="display:none;">教室長に送信する</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>マイカレンダー</h2>
      <p class="desc">担当授業を日付ごとに確認できます。<br>赤い点線のコマは、教室長からの授業依頼です。<br>「承認する」「断る」「キャンセルを依頼」を選び、最後に「教室長に送信する」でまとめて送ってください。</p>
      <div class="month-nav">
        <button type="button" class="nav-btn" id="calPrevBtn">‹</button>
        <div class="month-title" id="calMonthTitle">2026年8月</div>
        <button type="button" class="nav-btn" id="calNextBtn">›</button>
        <button type="button" class="today-btn" id="calTodayBtn">今月</button>
      </div>
      <div id="myCalWrap"></div>
    </div>
  </div>

  <div id="tab-shift" class="tab-view">
    <div class="card">
      <h2>月次スケジュール</h2>
      <p class="desc">クリックするたびに「×不可 → ○特に希望 → △対応可能 → ×不可」の順に切り替わります。未提出の月は直接編集できます。提出済み（確定）の月を変更したい場合は、クリックすると教室長に変更リクエストが届きます（自動では反映されません）。</p>
      <div class="month-nav">
        <button type="button" class="nav-btn" id="prevBtn">‹</button>
        <div class="month-title" id="monthTitle">2026年8月</div>
        <button type="button" class="nav-btn" id="nextBtn">›</button>
        <button type="button" class="today-btn" id="todayBtn">今月</button>
      </div>
      <div class="status-bar" id="statusBar"></div>
      <div class="grid-scroll" id="gridWrap"></div>
      <div class="form-actions">
        <button class="primary" id="submitBtn">この内容で提出する</button>
        <button class="send-request-btn" id="sendRequestBtn" style="display:none;">変更をリクエストする（0件）</button>
        <span class="form-msg" id="formMsg"></span>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/teacher/main.js"></script>
</body>
</html>

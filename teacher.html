<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピタコマ｜講師用ページ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/shared/styles/variables.css">
<link rel="stylesheet" href="/src/shared/styles/inline-confirm.css">
<link rel="stylesheet" href="/src/teacher/styles/teacher.css">
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1 class="login-title">ピタコマ</h1>
    <div class="login-sub">講師用ページ</div>
    <label class="field-label" for="loginEmail">メールアドレス</label>
    <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
    <div style="height:14px"></div>
    <label class="field-label" for="loginPassword">パスワード</label>
    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="パスワード">
    <div style="height:18px"></div>
    <button type="button" class="primary" id="loginBtn" style="width:100%;">ログイン</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<header class="top" id="appHeader" style="display:none;">
  <div class="inner">
    <div>
      <h1>ピタコマ</h1>
      <div class="sub" id="myNameLabel">講師用ページ</div>
    </div>
    <div class="header-account">
      <span id="loginUserEmail" class="header-email"></span>
      <button type="button" id="logoutBtn" class="logout-btn">ログアウト</button>
    </div>
  </div>
</header>

<div class="app" id="appRoot" style="display:none;">
  <div class="submit-dock submit-dock-d1" id="submitDock">
    <div class="submit-dock-block is-lesson" id="submitDockLesson" style="display:none;">
      <div class="submit-dock-head">
        <div class="submit-dock-lines">
          <p class="submit-dock-title">授業の承認・辞退</p>
          <dl class="submit-dock-kv" id="submitDockLessonKv"></dl>
          <div id="pendingBannerNotices" class="pending-banner-notices" style="display:none;"></div>
        </div>
        <div class="submit-dock-actions is-stacked">
          <button type="button" class="primary" id="submitResponsesBtn" style="display:none;">確認結果を提出する</button>
          <button type="button" class="ghost" id="draftApproveAllBtn" style="display:none;">残り1コマをすべて承認</button>
        </div>
      </div>
    </div>
    <div class="submit-dock-block is-shift" id="submitDockShift">
      <div class="submit-dock-head">
        <div class="submit-dock-lines">
          <div class="submit-dock-meta">
            <p class="submit-dock-title">シフト</p>
            <span id="shiftDockBadges" class="submit-dock-badges"></span>
          </div>
        </div>
        <div class="submit-dock-actions is-stacked">
          <button type="button" class="primary" id="submitShiftBtn">シフトを提出する</button>
          <button type="button" class="send-request-btn" id="sendRequestBtn" style="display:none;">変更を教室長に送る（0件）</button>
        </div>
      </div>
    </div>
  </div>
  <p class="submit-dock-msg" id="formMsg"></p>

  <div class="card">
    <h2>マイスケジュール</h2>
    <p class="desc">担当授業の確認と、空きコマのシフト提出がこの1画面でできます。<br>青枠のコマは教室長からの授業依頼です。承認・辞退を選び、上部の「確認結果を提出する」でまとめて送ってください。<br>授業のないコマでは ×不可・△可能・○優先 を選び、上部の「シフトを提出する」で送れます。</p>
    <div class="month-nav">
      <button type="button" class="nav-btn" id="calPrevBtn">‹</button>
      <div class="month-title" id="calMonthTitle">2026年8月</div>
      <button type="button" class="nav-btn" id="calNextBtn">›</button>
      <button type="button" class="today-btn" id="calTodayBtn">今月</button>
    </div>
    <div id="myCalWrap"></div>
  </div>
</div>

<script type="module" src="/src/teacher/main.js"></script>
</body>
</html>

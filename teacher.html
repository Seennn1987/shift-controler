<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピタコマ｜講師用ページ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/shared/styles/variables.css">
<link rel="stylesheet" href="/src/shared/styles/inline-confirm.css">
<link rel="stylesheet" href="/src/teacher/styles/teacher.css">
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1 class="login-title">ピタコマ</h1>
    <div class="login-sub">講師用ページ</div>
    <label class="field-label" for="loginEmail">メールアドレス</label>
    <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
    <div style="height:14px"></div>
    <label class="field-label" for="loginPassword">パスワード</label>
    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="パスワード">
    <div style="height:18px"></div>
    <button type="button" class="primary" id="loginBtn" style="width:100%;">ログイン</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<header class="top" id="appHeader" style="display:none;">
  <div class="inner">
    <div>
      <h1>ピタコマ</h1>
      <div class="sub" id="myNameLabel">講師用ページ</div>
    </div>
    <div class="header-account">
      <button type="button" id="openSubjectBtn" class="logout-btn">教科設定</button>
      <button type="button" id="logoutBtn" class="logout-btn">ログアウト</button>
    </div>
  </div>
</header>

<div class="app" id="appRoot" style="display:none;">
  <div id="viewHome">
  <div class="submit-dock submit-dock-d1" id="submitDock">
    <div class="submit-dock-block is-lesson" id="submitDockLesson" style="display:none;">
      <div class="submit-dock-head">
        <div class="submit-dock-lines">
          <p class="submit-dock-title">授業の承認・辞退</p>
          <dl class="submit-dock-kv" id="submitDockLessonKv"></dl>
          <div id="pendingBannerNotices" class="pending-banner-notices" style="display:none;"></div>
        </div>
        <div class="submit-dock-actions is-stacked">
          <button type="button" class="primary" id="submitResponsesBtn" style="display:none;">承認・辞退を提出する</button>
          <button type="button" class="ghost" id="draftApproveAllBtn" style="display:none;">残り1コマをすべて承認</button>
        </div>
      </div>
    </div>
    <div class="submit-dock-block is-absence" id="submitDockAbsence" style="display:none;">
      <div class="submit-dock-head">
        <div class="submit-dock-lines">
          <div class="submit-dock-meta">
            <p class="submit-dock-title">欠勤</p>
            <span id="absenceDockBadges" class="submit-dock-badges"></span>
          </div>
        </div>
        <div class="submit-dock-actions is-stacked">
          <button type="button" class="primary" id="submitAbsenceBtn">欠勤申請を提出する</button>
        </div>
      </div>
    </div>
    <div class="submit-dock-block is-shift" id="submitDockShift">
      <div class="submit-dock-head">
        <div class="submit-dock-lines">
          <div class="submit-dock-meta">
            <p class="submit-dock-title" id="shiftDockTitle">シフト</p>
            <span id="shiftDockBadges" class="submit-dock-badges"></span>
          </div>
        </div>
        <div class="submit-dock-actions is-stacked">
          <button type="button" class="primary" id="submitShiftBtn">新規シフトを提出する</button>
          <button type="button" class="primary" id="sendRequestBtn" style="display:none;">シフト変更を提出する</button>
        </div>
      </div>
    </div>
  </div>
  <p class="submit-dock-msg" id="formMsg"></p>

  <div class="card">
    <h2>マイスケジュール
      <button type="button" class="help-tip" id="myCalHelpBtn" aria-expanded="false" aria-controls="myCalHelpText" aria-label="この画面の使い方">?
        <span class="help-tip-text" id="myCalHelpText">
          <span><strong>授業（青い枠）</strong>教室長からのお願いを、引き受けるか辞退できます。選んだら、上のボタンで提出してください。</span>
          <span><strong>欠勤</strong>決まっている授業を休む申請ができます。欠勤申請を選んで、上のボタンで提出してください。</span>
          <span><strong>シフト</strong>空いている時間の出勤希望を出せます。×（不可）・△（可能）・○（優先）を選んで提出してください。</span>
        </span>
      </button>
    </h2>
    <div class="month-nav">
      <button type="button" class="nav-btn" id="calPrevBtn">‹</button>
      <div class="month-title" id="calMonthTitle">2026年8月</div>
      <button type="button" class="nav-btn" id="calNextBtn">›</button>
      <button type="button" class="today-btn" id="calTodayBtn">今月</button>
    </div>
    <div id="myCalWrap"></div>
  </div>
  </div>

  <div id="viewSubjects" hidden>
    <div class="card">
      <button type="button" class="ghost mp-back-btn" id="backToHomeBtn">← マイスケジュールに戻る</button>
      <h2>担当教科設定</h2>
      <p class="matching-priority-intro">
        <strong>★</strong>得意科目
        <span class="matching-priority-intro-sep">·</span>
        <strong>○</strong>対応可能
        <span class="matching-priority-intro-sep">·</span>
        <strong>×</strong>不可
      </p>
      <p class="desc">マスを押すと切り替わります。最後に「変更を保存」ボタンを押してください。</p>
      <div id="teacherMatrixWrap"></div>
      <p class="form-msg" id="subjectFormMsg"></p>
      <button type="button" class="primary" id="saveSubjectBtn">変更を保存</button>
    </div>
  </div>
</div>

  <div id="appConfirmOverlay" class="app-confirm-overlay" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="appConfirmTitle">
    <div class="app-confirm-card">
      <button type="button" class="app-confirm-close" id="appConfirmCloseBtn" aria-label="閉じる">×</button>
      <h2 class="app-confirm-title" id="appConfirmTitle"></h2>
      <p class="app-confirm-body" id="appConfirmBody"></p>
      <div class="app-confirm-extra" id="appConfirmExtra" hidden></div>
      <div class="app-confirm-actions">
        <button type="button" class="ghost app-confirm-cancel" id="appConfirmCancelBtn">やめる</button>
        <button type="button" class="app-confirm-submit primary" id="appConfirmSubmitBtn">OK</button>
      </div>
    </div>
  </div>

<script type="module" src="/src/teacher/main.js"></script>
</body>
</html>
